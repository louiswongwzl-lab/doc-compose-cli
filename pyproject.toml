[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-compose"
version = "0.1.0"
description = "Compose a final document from template A + content B: md-first pipeline, LLM filling, CN/EN/bilingual, docx/pdf output"
requires-python = ">=3.10"
dependencies = ["markitdown>=0.0.2", "openpyxl>=3.1"]

[project.scripts]
doc-compose = "doccompose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
